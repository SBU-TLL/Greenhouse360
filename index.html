<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>A-Frame Tour</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <!-- Waiting for update to support stereo images / A-frame Sky -->
    <script
        src="https://cdn.rawgit.com/oscarmarinmiro/aframe-stereo-component/master/dist/aframe-stereo-component.min.js">
    </script>
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"
        integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>

    <script src="jquery.csv.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <a-scene antialias="true">

        <a-entity light="type: ambient; color: #FFF"></a-entity>



        <a-entity id="cam" camera look-controls postition="0 0 0">

            <a-entity id="hudText" text="color: red" geometry="primitive: plane; width: 1.2; height:.08;"
            material="color: white;" position="20 21 -31" scale="30 30 30" rotation="0 0 0">
        </a-entity>
  
        <a-entity id="hudText2" text="color: red" geometry="primitive: plane; width: .6; height:.08;"
        material="color: white;" position="20 18 -31" scale="30 30 30" rotation="0 0 0">
    </a-entity>
            <a-entity id="slideWindow">
               
            </a-entity>

            <a-entity id="smartText" text="color: red" geometry="primitive: plane; width: .6; height:.08;"
                material="color: white;" position="0 -0.1 -1" scale="0 0 0" rotation="0 0 0"
                animation="dur:300;property:scale;to:0 0 0;startEvents:textHide;autoplay:false;"
                animation__2="dur:300;property:scale; to:1 1 1;startEvents:textShow;autoplay:false;">




                <!-- <a-entity id="textHolder"></a-entity> -->


            </a-entity>




            <a-entity id="cursor" cursor="fuse: true; fuseTimeout: 1000" position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: red; shader: flat">




            </a-entity>

        </a-entity>
        <a-entity id="markers"></a-entity>

        <a-sky id="sky1"></a-sky>

    </a-scene>
</body>

</html>
